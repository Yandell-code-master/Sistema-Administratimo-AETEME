name: CI

# Se ejecuta en cada push a main y en cada Pull Request contra main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - Restore, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/API/API

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend - Build imagen estatica
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      # Valida que el Dockerfile del servidor estático siga construyendo.
      # No hay lint, tests ni build de JS: el frontend es HTML/CSS/JS puro.
      - name: Construir imagen
        run: docker build ./frontend
