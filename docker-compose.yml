services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: proyecto-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DevPassword123!"   # Solo para desarrollo local. Nunca usar en producción.
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: proyecto-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db;Database=ProyectoDb;User Id=sa;Password=DevPassword123!;TrustServerCertificate=True;"
    ports:
      - "5000:8080"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: proyecto-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: "http://localhost:5000"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # evita que el node_modules del host pise el del contenedor

volumes:
  db-data:
