services:
  web:
    build: ./frontend
    ports:
      - "8000:8000"
    environment:
      # Vite reenvía /api al backend: para el navegador todo es el mismo origen.
      API_PROXY_TARGET: http://backend:8080
      # En Docker Desktop para Windows el watcher nativo a veces no detecta
      # cambios sobre bind mounts; con esto el hot reload es confiable.
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/API/API/obj
      - /app/API/API/bin
